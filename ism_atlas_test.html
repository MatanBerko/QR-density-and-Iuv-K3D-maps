/* ── vertex shader ── */
const VS=`
  uniform mat4 uInvModel;
  varying vec3 vOrig, vDir;
  void main() {
    vOrig = (uInvModel * vec4(cameraPosition, 1.0)).xyz;
    vDir  = position - vOrig;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;

/* ── fragment shader: samples 2D atlas as if it were a 3D texture ──
   Atlas layout: width = N*N (N slices of width N), height = N
   To sample vol at (u,v,w) in [0,1]^3:
     slice  = w * (N-1)          → float slice index
     slice0 = floor(slice)
     slice1 = min(slice0+1, N-1)
     atlas_u0 = (slice0 + u) / N  (offset into atlas width)
     atlas_u1 = (slice1 + u) / N
     sample and lerp between slice0 and slice1
*/
const FS=`
  precision highp float;
  uniform sampler2D uAtlas;
  uniform sampler2D uCmap;
  uniform float uVmin, uVmax, uAlpha;
  uniform int uSteps;
  uniform float uN;
  varying vec3 vOrig, vDir;

  float sampleVol(vec3 p) {
    /* p in [0,1]^3, x=right y=up z=depth */
    float w = clamp(p.z, 0.0, 1.0);
    float u = clamp(p.x, 0.0, 1.0);
    float v = clamp(p.y, 0.0, 1.0);
    float sliceF  = w * (uN - 1.0);
    float slice0  = floor(sliceF);
    float slice1  = min(slice0 + 1.0, uN - 1.0);
    float t       = sliceF - slice0;
    /* offset u into atlas strip */
    float au0 = (slice0 + u) / uN;
    float au1 = (slice1 + u) / uN;
    float s0  = texture2D(uAtlas, vec2(au0, v)).r;
    float s1  = texture2D(uAtlas, vec2(au1, v)).r;
    return mix(s0, s1, t);
  }

  vec2 rayBox(vec3 o, vec3 d) {
    vec3 inv = 1.0/d;
    vec3 t0  = (-0.5 - o)*inv;
    vec3 t1  = ( 0.5 - o)*inv;
    vec3 mn  = min(t0,t1), mx = max(t0,t1);
    return vec2(max(mn.x,max(mn.y,mn.z)), min(mx.x,min(mx.y,mx.z)));
  }

  void main() {
    vec3 d = normalize(vDir);
    vec2 b = rayBox(vOrig, d);
    if (b.x > b.y) discard;
    b.x = max(b.x, 0.0);
    float delta = (b.y - b.x) / float(uSteps);
    vec3  stp   = d * delta;
    vec3  pos   = vOrig + (b.x + 0.5*delta)*d;
    vec4  acc   = vec4(0.0);
    for (int i = 0; i < 512; i++) {
      if (i >= uSteps) break;
      /* pos is in [-0.5,0.5]^3, map to [0,1]^3 */
      vec3 uvw = pos + 0.5;
      float raw = sampleVol(uvw) * uVmax;   /* unnormalise */
      if (raw >= uVmin) {
        float val = clamp((raw - uVmin)/(uVmax - uVmin), 0.0, 1.0);
        if (val > 0.001) {
          vec3 col = texture2D(uCmap, vec2(val, 0.5)).rgb;
          float a  = clamp(sqrt(val) * uAlpha * delta * 55.0, 0.0, 0.06);
          acc.rgb += (1.0 - acc.a)*a*col;
          acc.a   += (1.0 - acc.a)*a;
        }
      }
      if (acc.a > 0.98) break;
      pos += stp;
    }
    if (acc.a < 0.003) discard;
    gl_FragColor = acc;
  }`;

    uCmap:   {value: cmapTex},
