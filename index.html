<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06060f;

  -webkit-tap-highlight-color:transparent;user-select:none}
body{display:flex;flex-direction:column}

header{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 14px;
  background:linear-gradient(90deg,#0a0a1e,#10103a);border-bottom:1px solid #1a1a40}
header h1{font-size:.82rem;font-weight:700;color:#8898e8;letter-spacing:.05em}
.tag{font-size:.6rem;padding:2px 7px;border-radius:8px;background:#141430;
  border:1px solid #222250;color:#5868b0;white-space:nowrap}
.tag.hi{color:#7888d8;border-color:#303070}
.spacer{flex:1}

.tabs{flex-shrink:0;display:flex;background:#08081a;border-bottom:1px solid #141432}
.tab{flex:1;padding:10px 4px;font-size:.78rem;font-weight:600;letter-spacing:.06em;
  text-align:center;cursor:pointer;color:#303068;border-bottom:3px solid transparent;
  transition:color .2s,border-color .2s}
.tab.active-dens{color:#8090e8;border-color:#6070d0}
.tab.active-iuv {color:#d08060;border-color:#c06020}

.scene-wrap{flex:1;position:relative;overflow:hidden;min-height:0;
  background:radial-gradient(ellipse at 50% 60%,#0c0c24 0%,#06060f 70%)}
canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.corner-label{position:absolute;top:10px;left:12px;pointer-events:none;
  font-size:.68rem;color:#3a3a70}
.orbit-hint{position:absolute;bottom:6px;right:10px;pointer-events:none;
  font-size:.56rem;color:#1e1e46}

.drawer{flex-shrink:0;background:#09091e;border-top:1px solid #141430;
  padding:7px 14px 12px;display:flex;flex-direction:column;gap:5px}
.cbar-row{display:flex;align-items:center;gap:8px}
.cbar-label{font-size:.6rem;color:#303068;white-space:nowrap;min-width:58px}
.cbar{flex:1;height:7px;border-radius:4px}
.cbar.plasma{background:linear-gradient(to right,#0d0887,#41049d,#6e00a8,#9700a8,#bf3984,#dc6f57,#f0a832,#f0f921)}
.cbar.inferno{background:linear-gradient(to right,#000004,#320a5e,#781b6c,#bb3654,#ec6824,#fbb41a,#fcffa4)}
.cbar-ticks{display:flex;justify-content:space-between;font-size:.57rem;color:#2a2a60;margin-top:1px}

.ctrl-row{display:flex;align-items:center;gap:8px}
.ctrl-lbl{min-width:52px;text-align:right;font-size:.64rem;color:#404888;flex-shrink:0}
.ctrl-row input[type=range]{flex:1;cursor:pointer;-webkit-appearance:none;
  appearance:none;height:4px;border-radius:2px;outline:none;background:#1a1a3a}
.ctrl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;

  border-radius:50%;cursor:pointer;border:2px solid #06060f}

#ivmin-sl::-webkit-slider-thumb,#ivmax-sl::-webkit-slider-thumb,

.ctrl-val{min-width:74px;font-family:monospace;font-size:.63rem;color:#7888c8;flex-shrink:0}

.spin{width:44px;height:44px;border:3px solid #141430;border-top-color:#5060c8;

</head>

    vec3 d = normalize(vDir);
    vec2 b = rayBox(vOrig, d);
    if (b.x > b.y) discard;
    b.x = max(b.x, 0.0);
    float delta = (b.y - b.x) / float(uSteps);
    vec3  stp   = d * delta;
    vec3  pos   = vOrig + (b.x + 0.5*delta)*d;
    vec4  acc   = vec4(0.0);
    for (int i = 0; i < 512; i++) {
      if (i >= uSteps) break;
      float raw = sampleVol(pos + 0.5);
      if (raw >= uVmin) {
        float val = clamp((raw - uVmin)/(uVmax - uVmin), 0.0, 1.0);
        if (val > 0.001) {
          vec3  col = texture2D(uCmap, vec2(val, 0.5)).rgb;
          float a   = clamp(sqrt(val)*uAlpha*delta*55.0, 0.0, 0.06);
          acc.rgb  += (1.0 - acc.a)*a*col;
          acc.a    += (1.0 - acc.a)*a;
        }
      }
      if (acc.a > 0.98) break;
      pos += stp;
    }
    if (acc.a < 0.003) discard;
    gl_FragColor = acc;
  }`;

/* ── fragment shader: log10 scale (IUV) ── */
const FS_LOG = `
  precision highp float;
  uniform sampler2D uAtlas;
  uniform sampler2D uCmap;
  uniform float uVmin, uVmax, uAlpha, uN, uVmaxData;
  uniform int uSteps;
  varying vec3 vOrig, vDir;

  float sampleVol(vec3 uvw) {
    float u = clamp(uvw.x, 0.0, 1.0);
    float v = clamp(uvw.y, 0.0, 1.0);
    float w = clamp(uvw.z, 0.0, 1.0);
    float sliceF = w * (uN - 1.0);
    float s0 = floor(sliceF);
    float s1 = min(s0 + 1.0, uN - 1.0);
    float t  = sliceF - s0;
    float v0 = texture2D(uAtlas, vec2((s0 + u) / uN, v)).r;
    float v1 = texture2D(uAtlas, vec2((s1 + u) / uN, v)).r;
    return mix(v0, v1, t) * uVmaxData;
  }

  vec2 rayBox(vec3 o, vec3 d) {
    vec3 inv = 1.0/d, t0=(-0.5-o)*inv, t1=(0.5-o)*inv;
    vec3 mn=min(t0,t1), mx=max(t0,t1);
    return vec2(max(mn.x,max(mn.y,mn.z)), min(mx.x,min(mx.y,mx.z)));
  }

  void main() {
    vec3 d = normalize(vDir);
    vec2 b = rayBox(vOrig, d);
    if (b.x > b.y) discard;
    b.x = max(b.x, 0.0);
    float delta = (b.y - b.x) / float(uSteps);
    vec3  stp   = d * delta;
    vec3  pos   = vOrig + (b.x + 0.5*delta)*d;
    vec3  glow  = vec3(0.0);
    for (int i = 0; i < 512; i++) {
      if (i >= uSteps) break;
      float raw = sampleVol(pos + 0.5);
      if (raw > 1e-6) {
        float logv = log(raw) / log(10.0);
        if (logv > uVmin) {
          float val = clamp((logv - uVmin)/(uVmax - uVmin), 0.0, 1.0);
          vec3  col = texture2D(uCmap, vec2(val, 0.5)).rgb;
          glow += col * pow(val, 1.2) * uAlpha * delta * 40.0;
        }
      }
      pos += stp;
    }
    if (dot(glow, vec3(1.0)) < 0.005) discard;
    vec3 mapped = glow / (glow + 1.0);
    gl_FragColor = vec4(mapped, clamp(dot(mapped, vec3(0.333))*2.0, 0.0, 1.0));
  }`;

/* ══════════════════════════════════════════════════
   SINGLE RENDERER — one canvas, tab switches scene
   ══════════════════════════════════════════════════ */
let renderer=null, ctrl=null;
let scenes={}, cameras={}, uniforms={}, meshes={};
let currentTab='dens';

function makeAtlasTex(u8, n) {
  const t = new THREE.DataTexture(u8, n*n, n, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return t;
}
function makeCmapTex(u8) {
  const t = new THREE.DataTexture(u8, 256, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}

function buildScenes() {
  const canvas = document.getElementById('c1');
  renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setClearColor(0x06060f, 1);
  renderer.autoClear = true;

  const cam = new THREE.PerspectiveCamera(38, 1, 0.001, 200);
  cam.position.set(0.0,-2.5,0.1);
  cam.up.set(0,0,1); cam.lookAt(0,0,0);
  ctrl = new THREE.OrbitControls(cam, canvas);
  ctrl.enableDamping = true; ctrl.dampingFactor = 0.05;
  ctrl.minDistance = 0.3;    ctrl.maxDistance = 20;
  ctrl.touches = {ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN};
  cameras['dens'] = cameras['iuv'] = cam;

  const densAtlas = makeAtlasTex(_DENS_ATLAS, N);
  const iuvAtlas  = makeAtlasTex(_IUV_ATLAS,  N);
  const dCmap     = makeCmapTex(_DCMAP);
  const iCmap     = makeCmapTex(_ICMAP);

  function mkScene(atlasTex, cmapTex, fsCode, vmin, vmax, alpha, vmaxData) {
    const S   = new THREE.Scene();
    const inv = new THREE.Matrix4();
    const U = {
      uAtlas:    {value: atlasTex},
      uCmap:     {value: cmapTex},
      uVmin:     {value: vmin},
      uVmax:     {value: vmax},
      uAlpha:    {value: alpha},
      uSteps:    {value: STEPS},
      uN:        {value: N_F},
      uVmaxData: {value: vmaxData},
      uInvModel: {value: inv},
    };
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1,1,1),
      new THREE.ShaderMaterial({
        uniforms: U, vertexShader: VS, fragmentShader: fsCode,
        side: THREE.BackSide, transparent: true, depthWrite: false,
      })
    );
    S.add(mesh);
    S.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.025,16,16),
      new THREE.MeshBasicMaterial({color:0xffe066})
    ));
    return {S, U, mesh, inv};
  }

  const d = mkScene(densAtlas, dCmap, FS_LIN, 0.3,15.0,2.0, DENS_VMAX_DATA);
  const u = mkScene(iuvAtlas,  iCmap, FS_LOG, -0.1, 0.6, 0.8,  IUV_VMAX_DATA);
  scenes['dens']=d.S;   scenes['iuv']=u.S;
  uniforms['dens']=d.U; uniforms['iuv']=u.U;
  meshes['dens']=d;     meshes['iuv']=u;
}

function resizeRenderer() {
  const wrap=document.getElementById('scene-wrap');
  renderer.setSize(wrap.clientWidth, wrap.clientHeight, false);
  cameras['dens'].aspect = wrap.clientWidth/wrap.clientHeight;
  cameras['dens'].updateProjectionMatrix();
}

function switchTab(which) {
  currentTab = which;
  document.getElementById('drawer-dens').style.display=(which==='dens')?'flex':'none';
  document.getElementById('drawer-iuv') .style.display=(which==='iuv') ?'flex':'none';
  document.getElementById('tab-dens').className='tab'+(which==='dens'?' active-dens':'');
  document.getElementById('tab-iuv') .className='tab'+(which==='iuv' ?' active-iuv':'');
  document.getElementById('corner-lbl').innerHTML =
    which==='dens'
      ? 'n<sub>H</sub> [cm⁻³] · plasma'
      : 'log₁₀ I<sub>UV</sub> [Habing] · inferno';
}

function renderLoop() {
  requestAnimationFrame(renderLoop);
  ctrl.update();
  const {S,mesh,inv} = meshes[currentTab];
  mesh.updateMatrixWorld();
  inv.copy(mesh.matrixWorld).invert();
  uniforms[currentTab].uInvModel.value = inv;
  renderer.render(S, cameras[currentTab]);
}

function dTicks(vmax) {
  const f=vmax<20?1:0;
  ['dt1','dt2','dt3','dt4'].forEach((id,k)=>
    document.getElementById(id).textContent=((k+1)*vmax/4).toFixed(f));
}
function iTicks(vmin, vmax) {
  const step=(vmax-vmin)/4;
  ['it0','it1','it2','it3','it4'].forEach((id,k)=>
    document.getElementById(id).textContent=(vmin+k*step).toFixed(1));
}

function bindSliders() {
  document.getElementById('vmin-sl').addEventListener('input',function(){
    const v=parseFloat(this.value); uniforms['dens'].uVmin.value=v;
    document.getElementById('vmin-val').textContent=v.toFixed(1)+' cm⁻³';});
  document.getElementById('vmax-sl').addEventListener('input',function(){
    const v=parseFloat(this.value); uniforms['dens'].uVmax.value=v;
    document.getElementById('vmax-val').textContent=v.toFixed(1)+' cm⁻³'; dTicks(v);});
  document.getElementById('alpha-sl').addEventListener('input',function(){
    const v=parseFloat(this.value)/10.0; uniforms['dens'].uAlpha.value=v;
    document.getElementById('alpha-val').textContent=v.toFixed(1);});
  document.getElementById('ivmin-sl').addEventListener('input',function(){
    const v=parseFloat(this.value); uniforms['iuv'].uVmin.value=v;
    document.getElementById('ivmin-val').textContent=v.toFixed(2)+' log G₀';
    iTicks(v, uniforms['iuv'].uVmax.value);});
  document.getElementById('ivmax-sl').addEventListener('input',function(){
    const v=parseFloat(this.value); uniforms['iuv'].uVmax.value=v;
    document.getElementById('ivmax-val').textContent=v.toFixed(2)+' log G₀';
    iTicks(uniforms['iuv'].uVmin.value, v);});
  document.getElementById('ialpha-sl').addEventListener('input',function(){
    const v=parseFloat(this.value)/10.0; uniforms['iuv'].uAlpha.value=v;
    document.getElementById('ialpha-val').textContent=v.toFixed(1);});
}

function boot() {
  const prog = document.getElementById('prog');
  const msg  = document.getElementById('msg');
  try {
    msg.textContent='Building scenes…'; prog.style.width='40%';
    buildScenes();
    prog.style.width='80%';
    resizeRenderer();
    new ResizeObserver(resizeRenderer).observe(document.getElementById('scene-wrap'));
    dTicks(15.0);
    iTicks(-0.1,0.6);
    bindSliders();
    prog.style.width='100%';
    requestAnimationFrame(()=>{
      document.getElementById('overlay').style.display='none';
      renderLoop();
    });
  } catch(e) {
    msg.textContent='Error: '+e.message;
    prog.style.background='#a03030';
    console.error(e);
  }
}

setTimeout(boot, 50);
</script>
</body>
</html>
